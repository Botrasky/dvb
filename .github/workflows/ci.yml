name: CI

on:
  push:
    branches: [main, test]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Run Astro checks
        run: npm run check
      - name: Build Astro site
        run: npm run build
      - name: Check built routes and links
        run: npm run check:routes
      - name: Check progress record
        env:
          PROGRESS_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PROGRESS_HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-progress-record.mjs
      - name: Run repo checks
        run: bash scripts/ci-check.sh
